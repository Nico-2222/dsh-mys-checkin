<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>米游社每日签到 · dsh-mys-checkin</title>
<style>
  :root {
    color-scheme: light;
    --blue-1: #a3dbfa;
    --blue-2: #c4e9fd;
    --blue-3: #eaf9ff;
    --card: rgba(255,255,255,.9);
    --line: rgba(255,255,255,.55);
    --line-strong: #9ed6ff;
    --fg: #17364f;
    --dim: #5f7f99;
    --brand: #13a1ff;
    --cyan: #4fd2ff;
    --grad: linear-gradient(135deg, #13a1ff 0%, #56d8ff 100%);
    --ok: #0f9f6e;
    --ok-bg: #e9f8f2;
    --warn: #b6791a;
    --warn-bg: #fdf4e3;
    --bad: #d9485a;
    --bad-bg: #fdecef;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html {
    background:
      radial-gradient(900px 460px at 12% -14%, rgba(255,255,255,.20), transparent 62%),
      radial-gradient(680px 420px at 92% 8%, rgba(86,216,255,.35), transparent 66%),
      linear-gradient(165deg, var(--blue-1) 0%, var(--blue-2) 48%, var(--blue-3) 100%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-attachment: fixed;
  }
  body {
    margin: 0; padding: 34px 24px 48px;
    min-height: 100vh;
    color: var(--fg);
    font: 14px/1.6 "PingFang SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; display: grid; gap: 16px; }
  header.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .logoWrap {
    display: flex; align-items: center; padding: 7px 12px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 10px 24px -16px rgba(3,49,94,.65);
  }
  header.brand img.logo { height: 26px; width: auto; display: block; }
  header.brand .titles { display: grid; gap: 2px; }
  header.brand h1 { font-size: 18px; margin: 0; color: #123b5e; letter-spacing: .01em; }
  header.brand .sub { font-size: 12px; color: rgba(18,59,94,.72); }
  header.brand .badge {
    margin-left: auto; font-size: 11px; color: #0b7fc4;
    border: 1px solid rgba(255,255,255,.9); border-radius: 999px; padding: 4px 10px;
    background: rgba(255,255,255,.72); white-space: nowrap;
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    backdrop-filter: blur(10px) saturate(112%);
    -webkit-backdrop-filter: blur(10px) saturate(112%);
    box-shadow: 0 22px 46px -30px rgba(3,49,94,.55);
  }
  .card h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin: 0 0 14px; color: #5b7d9b;
    font-weight: 600; letter-spacing: .06em;
  }
  .card h2::before {
    content: ""; width: 3px; height: 14px; border-radius: 2px;
    background: var(--grad);
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
  label.game {
    --g: var(--brand);
    display: flex; gap: 10px; align-items: center;
    padding: 9px 12px 9px 10px;
    border: 1px solid rgba(19,161,255,.12);
    border-radius: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.6);
    transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  label.game:hover { border-color: var(--line-strong); background: #fff; }
  label.game img { width: 30px; height: 30px; border-radius: 50%; background: #fff; flex: none; box-shadow: 0 0 0 1px rgba(19,161,255,.14); }
  label.game .name { flex: 1; font-size: 13.5px; color: #1b3d59; }
  label.game input[type=checkbox] {
    appearance: none; -webkit-appearance: none;
    width: 17px; height: 17px; border-radius: 6px; flex: none;
    border: 1.5px solid rgba(19,161,255,.34);
    background: #fff; cursor: pointer; position: relative;
    transition: all .16s ease;
  }
  label.game input[type=checkbox]:checked {
    border-color: transparent; background: var(--grad);
  }
  label.game input[type=checkbox]:checked::after {
    content: ""; position: absolute; left: 5px; top: 2px;
    width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(42deg);
  }
  label.game:has(input:checked) {
    border-color: color-mix(in srgb, var(--g) 40%, #ffffff);
    background: color-mix(in srgb, var(--g) 8%, #ffffff);
    box-shadow: 0 10px 22px -18px color-mix(in srgb, var(--g) 85%, transparent);
  }
  input[type=time], input[type=number] {
    background: #fff; color: var(--fg);
    border: 1px solid rgba(19,161,255,.16); border-radius: 10px;
    padding: 8px 11px; font: inherit; font-variant-numeric: tabular-nums;
  }
  input[type=time]:focus, input[type=number]:focus {
    outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(19,161,255,.16);
  }
  label { color: #1b3d59; }
  button {
    background: var(--grad); color: #fff; border: 0; border-radius: 10px;
    padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 10px 20px -14px rgba(10,120,210,.9);
    transition: filter .16s ease, transform .16s ease;
  }
  button:hover { filter: brightness(1.04); }
  button:active { transform: translateY(1px); }
  button.ghost {
    background: #fff; color: #2a5a7c; font-weight: 500;
    border: 1px solid rgba(19,161,255,.2); box-shadow: none;
  }
  button.ghost:hover { border-color: var(--line-strong); }
  button:disabled { opacity: .55; cursor: default; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #0b7fc4; background: rgba(233,246,255,.9); padding: 1px 5px; border-radius: 5px; }
  .muted { color: var(--dim); }
  .hint { font-size: 12px; color: var(--dim); }
  .pill {
    display: inline-flex; gap: 6px; align-items: center;
    padding: 3px 11px; border-radius: 999px; font-size: 12px;
    background: #fff; border: 1px solid rgba(19,161,255,.16); color: #3d6280;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); border-color: #bfe9d8; background: var(--ok-bg); }
  .pill.bad { color: var(--bad); border-color: #f6c9d0; background: var(--bad-bg); }
  .pill.warn { color: var(--warn); border-color: #f1ddb6; background: var(--warn-bg); }
  .qr { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .qr .frame {
    padding: 9px; border-radius: 18px; flex: none;
    background: #fff;
    box-shadow: 0 18px 36px -26px rgba(3,49,94,.6), 0 0 0 1px rgba(19,161,255,.14);
  }
  .qr img { display: block; width: 188px; height: 188px; background: #fff; border-radius: 12px; }
  .results { display: grid; gap: 8px; font-size: 13px; }
  .results .line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .results .line b { color: #123b5e; font-weight: 600; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 6px; background: #eef6ff; color: #4d6d8a; }
  .tag.signed { color: var(--ok); background: var(--ok-bg); }
  .tag.already { color: #0b7fc4; background: #e9f4ff; }
  .tag.failed { color: var(--bad); background: var(--bad-bg); }
  ul.history { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 12.5px; }
  ul.history li { display: flex; gap: 12px; align-items: center; color: #24506f; }
  ul.history li + li { padding-top: 8px; border-top: 1px dashed rgba(19,161,255,.16); }
  a { color: #0b7fc4; }
  footer.privacy { font-size: 12px; color: rgba(18,59,94,.72); text-align: center; line-height: 1.7; margin-top: 6px; }
  footer.privacy code { background: rgba(255,255,255,.75); color: #0b7fc4; }
  @media (max-width: 560px) {
    body { padding: 20px 14px 36px; }
    header.brand .badge { display: none; }
    header.brand .sub { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <span class="logoWrap"><img class="logo" src="__BASE__/assets/miyoushe.png" alt="米游社" /></span>
    <div class="titles">
      <h1>每日签到</h1>
      <span class="sub">米哈游游戏社区 · 自动领取每日奖励</span>
    </div>
    <span class="badge">dsh-mys-checkin</span>
  </header>

  <section class="card">
    <h2>账号</h2>
    <div class="row" id="account"><span class="muted">读取中…</span></div>
  </section>

  <section class="card" id="loginCard" hidden>
    <h2>扫码登录</h2>
    <div class="qr">
      <div class="frame" id="qrFrame" hidden><img id="qrImg" alt="登录二维码" /></div>
      <div>
        <div id="loginStatus" class="muted">用「米游社」App 扫码并在手机上确认。</div>
        <div class="row" style="margin-top:12px">
          <button id="qrStart">获取二维码</button>
          <button id="logout" class="ghost">退出登录</button>
        </div>
        <div class="hint" style="margin-top:10px">二维码 3 分钟内有效；凭证过期后重新扫一次即可。</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>要签到的游戏</h2>
    <div class="grid" id="games"></div>
  </section>

  <section class="card">
    <h2>签到计划</h2>
    <div class="row">
      <label>每天 <input type="time" id="signTime" value="00:30" /></label>
      <label>随机延迟 <input type="number" id="jitter" min="0" max="120" step="1" value="10" style="width:74px" /> 分钟</label>
      <label class="game" style="padding:6px 12px"><input type="checkbox" id="autoSign" checked /><span class="name">自动签到</span></label>
      <label class="game" style="padding:6px 12px"><input type="checkbox" id="catchUp" checked /><span class="name">启动补签</span></label>
    </div>
    <div class="row" style="margin-top:16px">
      <button id="save">保存设置</button>
      <button id="run" class="ghost">立即签到</button>
      <span class="muted" id="saveNote"></span>
    </div>
  </section>

  <section class="card">
    <h2>本次 / 最近结果</h2>
    <div class="results" id="results"><span class="muted">还没有运行记录。</span></div>
  </section>

  <section class="card">
    <h2>历史</h2>
    <ul class="history" id="history"><li class="muted">—</li></ul>
  </section>

  <footer class="privacy">
    账号凭证只保存在本机 <code>$DSH_HOME/data/mys-checkin/state.json</code>（0600），不会出现在日志、工具输出或对话里。<br />
    游戏图标与「米游社」标识版权归米哈游（miHoYo）所有，此处仅作识别用途。
  </footer>
</main>
<script>
const BASE = "__BASE__";
const $ = (id) => document.getElementById(id);
const ASSET = (name) => BASE + '/assets/' + name + '.png';
const GAME_META = {
  genshin: { icon: 'ys', color: '#b08d57' },
  starrail: { icon: 'sr', color: '#8b6fd8' },
  zzz: { icon: 'zzz', color: '#c2a000' },
  honkai3rd: { icon: 'bh3', color: '#3d7fe0' },
  tears: { icon: 'tears', color: '#dd6a97' },
  honkai2: { icon: 'bh2', color: '#12a37f' },
};
let pollTimer = null;

async function api(path, options) {
  const res = await fetch(BASE + '/api/' + path, Object.assign({ headers: { 'content-type': 'application/json' } }, options));
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) throw new Error(body.error || ('HTTP ' + res.status));
  return body;
}

function mask(text) { return text || '—'; }

function renderAccount(state) {
  const box = $('account');
  const acc = state.account;
  $('logout').hidden = acc === null || acc === undefined || acc.expired === true;
  if (!acc) {
    box.innerHTML = '<span class="pill bad">未登录</span><span class="muted">需要先扫码登录一次米游社账号。</span>';
    $('loginCard').hidden = false;
    return;
  }
  const expired = acc.expired === true;
  box.innerHTML = '<span class="pill ' + (expired ? 'bad' : 'ok') + '">' + (expired ? '凭证失效' : '已登录') + '</span>'
    + '<span>' + (acc.nickname || '米游社账号') + '</span>'
    + '<span class="muted">UID ' + mask(acc.uid) + '</span>';
  $('loginCard').hidden = !expired;
}

function renderGames(state) {
  const box = $('games');
  box.innerHTML = '';
  for (const game of state.games) {
    const meta = GAME_META[game.id] || {};
    const label = document.createElement('label');
    label.className = 'game';
    if (meta.color) label.style.setProperty('--g', meta.color);
    const icon = document.createElement('img');
    icon.src = ASSET(meta.icon || game.id);
    icon.alt = '';
    icon.loading = 'lazy';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = game.enabled === true;
    input.dataset.id = game.id;
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = game.name;
    label.appendChild(icon);
    label.appendChild(name);
    label.appendChild(input);
    box.appendChild(label);
  }
}

function renderSettings(state) {
  $('signTime').value = state.settings.signTime;
  $('jitter').value = state.settings.jitterMinutes;
  $('autoSign').checked = state.settings.autoSign === true;
  $('catchUp').checked = state.settings.catchUp === true;
}

function tag(status) {
  const map = { signed: ['已签到', 'signed'], already: ['今日已签', 'already'], failed: ['失败', 'failed'] };
  const [text, cls] = map[status] || [status, ''];
  return '<span class="tag ' + cls + '">' + text + '</span>';
}

function renderReport(report) {
  const box = $('results');
  const rows = [];
  for (const game of report.games || []) {
    if (game.error) { rows.push('<div class="line"><b>' + game.name + '</b><span class="tag failed">' + game.error + '</span></div>'); continue; }
    for (const role of game.roles || []) {
      const extra = role.award ? '奖励「' + role.award + '」' : (role.totalDays != null ? '累计 ' + role.totalDays + ' 天' : '');
      rows.push('<div class="line"><b>' + game.name + '</b><span class="muted">' + role.regionName + ' · ' + (role.nickname || role.uid) + '</span>' + tag(role.status) + '<span class="muted">' + extra + (role.status === 'failed' ? (role.message || '') : '') + '</span></div>');
    }
  }
  box.innerHTML = rows.length ? rows.join('') : '<span class="muted">没有可签到的角色。</span>';
}

function renderHistory(state) {
  const list = $('history');
  const entries = state.history || [];
  if (!entries.length) { list.innerHTML = '<li class="muted">—</li>'; return; }
  list.innerHTML = entries.map((entry) => {
    const roles = (entry.games || []).flatMap((game) => game.roles || []);
    const signed = roles.filter((role) => role.status === 'signed').length;
    const failed = roles.filter((role) => role.status === 'failed').length;
    const when = String(entry.at || '').replace('T', ' ').slice(0, 16);
    const reason = entry.reason === 'schedule' ? '定时' : entry.reason === 'catch-up' ? '补签' : '手动';
    return '<li><span class="muted">' + when + '</span><span>' + reason + '</span><span class="tag ' + (failed ? 'failed' : 'signed') + '">新签 ' + signed + ' / 失败 ' + failed + '</span></li>';
  }).join('');
}

async function refresh() {
  const body = await api('state');
  renderAccount(body.state);
  renderGames(body.state);
  renderSettings(body.state);
  renderHistory(body.state);
  if (body.state.today && body.state.today.length) renderReport(body.state.today[0]);
}

$('qrStart').addEventListener('click', async () => {
  const status = $('loginStatus');
  status.textContent = '正在获取二维码…';
  try {
    const body = await api('login/start', { method: 'POST', body: '{}' });
    $('qrImg').src = body.dataUrl;
    $('qrFrame').hidden = false;
    status.textContent = '请用米游社 App 扫码，并在手机上确认。';
    startPolling(body.ticket);
  } catch (error) {
    status.textContent = '获取二维码失败：' + error.message;
  }
});

function startPolling(ticket) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const body = await api('login/poll?ticket=' + encodeURIComponent(ticket));
      if (body.done) {
        clearInterval(pollTimer);
        $('qrFrame').hidden = true;
        $('loginStatus').textContent = '登录成功，凭证已保存。';
        await refresh();
      } else if (body.status === 'Scanned') {
        $('loginStatus').textContent = '已扫码，请在手机上点确认。';
      } else if (body.status === 'Expired' || body.status === 'Canceled') {
        clearInterval(pollTimer);
        $('qrFrame').hidden = true;
        $('loginStatus').textContent = '二维码已失效，请重新获取。';
      }
    } catch (error) {
      clearInterval(pollTimer);
      $('loginStatus').textContent = '轮询失败：' + error.message;
    }
  }, 2000);
}

$('logout').addEventListener('click', async () => {
  await api('logout', { method: 'POST', body: '{}' }).catch(() => {});
  await refresh();
});

$('save').addEventListener('click', async () => {
  const games = [...document.querySelectorAll('#games input:checked')].map((input) => input.dataset.id);
  $('saveNote').textContent = '保存中…';
  try {
    await api('settings', { method: 'POST', body: JSON.stringify({
      games,
      signTime: $('signTime').value,
      jitterMinutes: Number($('jitter').value),
      autoSign: $('autoSign').checked,
      catchUp: $('catchUp').checked,
    }) });
    $('saveNote').textContent = '已保存';
    setTimeout(() => { $('saveNote').textContent = ''; }, 2000);
    await refresh();
  } catch (error) {
    $('saveNote').textContent = '保存失败：' + error.message;
  }
});

$('run').addEventListener('click', async () => {
  const button = $('run');
  button.disabled = true;
  $('results').innerHTML = '<span class="muted">正在签到…</span>';
  try {
    const body = await api('sign', { method: 'POST', body: '{}' });
    renderReport(body.report);
    await refresh();
  } catch (error) {
    $('results').innerHTML = '<span class="tag failed">' + error.message + '</span>';
  } finally {
    button.disabled = false;
  }
});

refresh().catch((error) => { $('account').textContent = '加载失败：' + error.message; });
</script>
</body>
</html>
